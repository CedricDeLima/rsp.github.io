<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Formulaire FindRISC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>

  <h1>Évaluation du risque</h1>

  <form id="form">

    <label>Âge</label>
    <select id="age">
      <option value="<45">< 45</option>
      <option value="45-54">45-54</option>
      <option value="55-64">55-64</option>
      <option value="≥65">≥ 65</option>
    </select>

    <label>IMC</label>
    <select id="imc">
      <option value="<25">< 25</option>
      <option value="25-30">25-30</option>
      <option value=">30">> 30</option>
    </select>

    <label>Tour de taille</label>
    <select id="taille">
      <option value="low">Normal</option>
      <option value="mid">Élevé</option>
      <option value="high">Très élevé</option>
    </select>

    <label>Activité physique régulière</label>
    <input type="checkbox" id="sport" />

    <label>Consommation fruits/légumes</label>
    <input type="checkbox" id="food" />

    <label>Traitement hypertension</label>
    <input type="checkbox" id="tension" />

    <label>Glycémie élevée</label>
    <input type="checkbox" id="glycemie" />

    <label>Antécédents familiaux</label>
    <select id="antecedents">
      <option value="Aucun">Aucun</option>
      <option value="Famille éloignée">Famille éloignée</option>
      <option value="Famille proche">Famille proche</option>
    </select>

    <br /><br />

    <button type="submit">Envoyer</button>

  </form>

  <script type="module">
    import { submitForm } from '/js/app.js';

    const form = document.getElementById("form");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("event");

      const payload = {
        event_id: eventId,
        age: document.getElementById("age").value,
        IMC: document.getElementById("imc").value,
        tour_taille: document.getElementById("taille").value,
        Act_physique: document.getElementById("sport").checked,
        fruits_legumes: document.getElementById("food").checked,
        trait_hypertenseur: document.getElementById("tension").checked,
        glycemie: document.getElementById("glycemie").checked,
        "antécédents": document.getElementById("antecedents").value
      };

      await submitForm(payload);
    });
  </script>

</body>
</html>
