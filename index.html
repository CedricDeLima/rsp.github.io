<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    margin: 0;
    padding: 10px;
    text-align: center;
}

.container {
    background: white;
    border-radius: 15px;
    padding: 20px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.progress {
    height: 10px;
    background: #eee;
    border-radius: 10px;
    margin-bottom: 20px;
}

.progress-bar {
    height: 10px;
    background: #4facfe;
    width: 0%;
    border-radius: 10px;
    transition: 0.3s;
}

button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #e0e0e0;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #4facfe;
    color: white;
}

#result {
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Test FINDRISC</h2>

  <!-- ✅ 2. Ton script -->

    );
  </script>

<input type="email" id="email" placeholder="Votre email" required>

<div class="progress">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div id="question"></div>

<div id="answers"></div>

<div id="result"></div>

</div>

<script>

let step = 0;
let score = 0;

const questions = [

{
    text: "Quel est votre âge ?",
    options: [
        {label: "< 45 ans", points: 0},
        {label: "45–54 ans", points: 2},
        {label: "55–64 ans", points: 3},
        {label: "> 64 ans", points: 4}
    ]
},

{
    text: "Votre IMC ?",
    options: [
        {label: "< 25", points: 0},
        {label: "25–30", points: 1},
        {label: "> 30", points: 3}
    ]
},

{
    text: "Activité physique quotidienne ?",
    options: [
        {label: "Oui", points: 0},
        {label: "Non", points: 2}
    ]
},

{
    text: "Consommez-vous des fruits/légumes ?",
    options: [
        {label: "Oui", points: 0},
        {label: "Non", points: 1}
    ]
},

{
    text: "Traitement antihypertenseur ?",
    options: [
        {label: "Non", points: 0},
        {label: "Oui", points: 2}
    ]
},

{
    text: "Glycémie élevée dans le passé ?",
    options: [
        {label: "Non", points: 0},
        {label: "Oui", points: 5}
    ]
},

{
    text: "Antécédents familiaux ?",
    options: [
        {label: "Aucun", points: 0},
        {label: "Éloigné", points: 3},
        {label: "Proche", points: 5}
    ]
}

];
function getEvent() { const params = new URLSearchParams(window.location.search); return
params.get("event") || "Hors evenement"; }
function showQuestion() {

    if (step >= questions.length) {
        showResult();
        return;
    }

    let q = questions[step];

    document.getElementById("question").innerHTML = `<p>${q.text}</p>`;

    let answersHTML = "";

    q.options.forEach(option => {
        answersHTML += `<button onclick="nextStep(${option.points})">${option.label}</button>`;
    });

    document.getElementById("answers").innerHTML = answersHTML;

    updateProgress();
}

function nextStep(points) {
    score += points;
    step++;
    showQuestion();
}

function updateProgress() {
    let progress = (step / questions.length) * 100;
    document.getElementById("progressBar").style.width = progress + "%";
}

function showResult() {

    let interpretation = "";

    if (score <= 6) interpretation = "Faible (~1%)";
    else if (score <= 11) interpretation = "Légèrement élevé (~4%)";
    else if (score <= 14) interpretation = "Modéré (~17%)";
    else if (score <= 20) interpretation = "Élevé (~33%)";
    else interpretation = "Très élevé (~50%)";

    document.getElementById("question").innerHTML = "";
    document.getElementById("answers").innerHTML = "";

    document.getElementById("result").innerHTML =
        `Score : ${score}<br>Risque : ${interpretation}`;
}

showQuestion();
document.querySelector("form").addEventListener("submit", async (e) => { e.preventDefault();
const formData = new FormData(e.target); const data = { name: formData.get("name"), email:
formData.get("email"), message: formData.get("message"), event: getEvent() }; const { error } =
await supabase .from("form_responses") .insert([data]); if (error) { alert("Erreur : " + error.message);
} else { alert("Formulaire envoyé !"); e.target.reset(); } });
</script>

</body>
