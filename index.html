<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Accueil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #1a56db 0%, #3b82f6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-container {
    text-align: center;
    padding: 40px;
  }
  h1 {
    color: white;
    font-size: 2.5rem;
    margin-bottom: 16px;
  }
  p {
    color: rgba(255,255,255,0.9);
    font-size: 1.1rem;
    margin-bottom: 36px;
    line-height: 1.6;
  }
  .btn-accueil {
    display: inline-block;
    background: white;
    color: #1a56db;
    padding: 18px 42px;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-accueil:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
<div class="home-container">
 
  <h1>🩺 Bienvenue</h1>
 <script>
const params = new URLSearchParams(window.location.search);
const name = params.get('name');

if (name) {
  document.getElementById('eventBadge').textContent =
    "📍 " + decodeURIComponent(name);
}
</script>
  <p>Évaluez votre risque de diabète en quelques minutes<br>grâce au test FINDRISC</p>
 <div id="eventBadge"></div>


  <button onclick="goToQuestionnaire()">Commencer le test</button>

<script>
function goToQuestionnaire() {
  const params = new URLSearchParams(window.location.search);

  const eventId = params.get('event_id');
  const eventName = params.get('name');

  let url = 'questionnaire.html';

  if (eventId || eventName) {
    const newParams = new URLSearchParams();
    if (eventId) newParams.set('event_id', eventId);
    if (eventName) newParams.set('name', eventName);

    url += '?' + newParams.toString();
  }

  window.location.href = url;
}
</script>

</div>
</body>
</html>
