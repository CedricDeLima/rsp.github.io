<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test FINDRISC</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    margin: 0;
    padding: 10px;
    text-align: center;
}

.container {
    background: white;
    border-radius: 15px;
    padding: 20px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.progress {
    height: 10px;
    background: #eee;
    border-radius: 10px;
    margin-bottom: 20px;
}

.progress-bar {
    height: 10px;
    background: #4facfe;
    width: 0%;
    border-radius: 10px;
    transition: 0.3s;
}

button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #e0e0e0;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #4facfe;
    color: white;
}

#result {
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Test FINDRISC</h2>
<!-- ✅ 1. Charger la librairie Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- ✅ 2. Ton script -->

      "https://xrtmlddmoepmomvtjgok.supabase.co",

    );
  </script>

<input type="email" id="email" placeholder="Votre email" required>

<div class="progress">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div id="question"></div>

<div id="answers"></div>

<div id="result"></div>

</div>

<script>

let step = 0;
let score = 0;

let answersData = {
    age: null,
    IMC: null,
    Act_physique: null,
    fruits_legumes: null,
    trait_hypertenseur: null,
    glycemie: null,
    antécédents: null
};

const questions = [

{
    key: "age",
    text: "Quel est votre âge ?",
    options: [
        {label: "< 45 ans", value: "<45", points: 0},
        {label: "45–54 ans", value: "45-54", points: 2},
        {label: "55–64 ans", value: "55-64", points: 3},
        {label: "> 64 ans", value: ">64", points: 4}
    ]
},

{
    key: "IMC",
    text: "Votre IMC ?",
    options: [
        {label: "< 25", value: "<25", points: 0},
        {label: "25–30", value: "25-30", points: 1},
        {label: "> 30", value: ">30", points: 3}
    ]
},

{
    key: "Act_physique",
    text: "Activité physique quotidienne ?",
    options: [
        {label: "Oui", value: true, points: 0},
        {label: "Non", value: false, points: 2}
    ]
},

{
    key: "fruits_legumes",
    text: "Consommez-vous des fruits/légumes ?",
    options: [
        {label: "Oui", value: true, points: 0},
        {label: "Non", value: false, points: 1}
    ]
},

{
    key: "trait_hypertenseur",
    text: "Traitement antihypertenseur ?",
    options: [
        {label: "Non", value: false, points: 0},
        {label: "Oui", value: true, points: 2}
    ]
},

{
    key: "glycemie",
    text: "Glycémie élevée dans le passé ?",
    options: [
        {label: "Non", value: false, points: 0},
        {label: "Oui", value: true, points: 5}
    ]
},

{
    key: "antécédents",
    text: "Antécédents familiaux ?",
    options: [
        {label: "Aucun", value: "aucun", points: 0},
        {label: "Éloigné", value: "eloigne", points: 3},
        {label: "Proche", value: "proche", points: 5}
    ]
}

];

function getEvent() {
    const params = new URLSearchParams(window.location.search);
    return params.get("event") || "Hors evenement";
}

function showQuestion() {

    if (step >= questions.length) {
        showResult();
        return;
    }

    let q = questions[step];

    document.getElementById("question").innerHTML = `<p>${q.text}</p>`;

    let answersHTML = "";

    q.options.forEach(option => {
        answersHTML += `
        <button type="button"
        onclick="nextStep('${q.key}', '${option.value}', ${option.points})">
        ${option.label}
        </button>`;
    });

    document.getElementById("answers").innerHTML = answersHTML;

    updateProgress();
}

function nextStep(key, value, points) {

    // ✅ conversion boolean propre
    if (value === "true") value = true;
    if (value === "false") value = false;

    answersData[key] = value;
    score += points;

    step++;
    showQuestion();
}

function updateProgress() {
    let progress = (step / questions.length) * 100;
    document.getElementById("progressBar").style.width = progress + "%";
}

async function showResult() {

    let interpretation = "";

    if (score <= 6) interpretation = "Faible (~1%)";
    else if (score <= 11) interpretation = "Légèrement élevé (~4%)";
    else if (score <= 14) interpretation = "Modéré (~17%)";
    else if (score <= 20) interpretation = "Élevé (~33%)";
    else interpretation = "Très élevé (~50%)";

    document.getElementById("question").innerHTML = "";
    document.getElementById("answers").innerHTML = "";

    document.getElementById("result").innerHTML =
        `Score : ${score}<br>Risque : ${interpretation}`;

    await sendToSupabase();
}

async function sendToSupabase() {

    const email = document.getElementById("email").value;

    if (!email) {
        alert("Email requis");
        return;
    }

    const payload = {
        email: email,
        age: answersData.age,
        IMC: answersData.IMC,
        Act_physique: answersData.Act_physique,
        fruits_legumes: answersData.fruits_legumes,
        trait_hypertenseur: answersData.trait_hypertenseur,
        glycemie: answersData.glycemie,
        "antécédents": answersData.antécédents,
        event: getEvent()
    };

    const { error } = await supabase
        .from("form_responses")
        .insert([payload]);

    if (error) {
        alert("Erreur : " + error.message);
    } else {
        console.log("✅ Données envoyées", payload);
    }
}

showQuestion();

</script>


</body>
</html>
