<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – ReSpoP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  /* Auth */
  #authScreen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .auth-card {
    background: #1e293b; border-radius: 16px; padding: 40px;
    width: 360px; text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .auth-card h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .auth-card p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
  .auth-input {
    width: 100%; padding: 14px; border-radius: 10px;
    border: 2px solid #334155; background: #0f172a; color: white;
    font-size: 1rem; margin-bottom: 16px; outline: none;
  }
  .auth-input:focus { border-color: #3b82f6; }
  .auth-btn {
    width: 100%; padding: 14px; background: #3b82f6; color: white;
    border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
    cursor: pointer;
  }
  .auth-btn:hover { background: #2563eb; }
  .auth-error { color: #f87171; font-size: 0.85rem; margin-top: 8px; display: none; }

  /* Main */
  #mainApp { display: none; }

  .topbar {
    background: #1e293b;
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #334155;
  }
  .topbar h1 { font-size: 1.2rem; font-weight: 700; color: #f1f5f9; }
  .topbar-right { display: flex; gap: 12px; }

  .btn {
    padding: 10px 18px; border-radius: 8px; border: none;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-blue { background: #3b82f6; color: white; }
  .btn-green { background: #10b981; color: white; }
  .btn-red { background: #ef4444; color: white; }
  .btn-yellow { background: #f59e0b; color: #1a1a1a; }
  .btn-gray { background: #475569; color: white; }

  .content { padding: 32px; max-width: 1100px; margin: 0 auto; }

  /* Stats */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 32px;
  }
  .stat-card {
    background: #1e293b; border-radius: 12px; padding: 20px;
    text-align: center; border: 1px solid #334155;
  }
  .stat-num { font-size: 2.2rem; font-weight: 800; color: #3b82f6; }
  .stat-label { font-size: 0.82rem; color: #94a3b8; margin-top: 4px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid #334155; }
  .tab {
    padding: 12px 20px; border-radius: 8px 8px 0 0; cursor: pointer;
    font-weight: 600; font-size: 0.9rem; color: #94a3b8;
    border: none; background: none; transition: all 0.2s;
  }
  .tab.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; margin-bottom: -2px; }
  .tab:hover { color: #e2e8f0; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Events */
  .event-create {
    background: #1e293b; border-radius: 12px; padding: 24px;
    margin-bottom: 24px; border: 1px solid #334155;
  }
  .event-create h3 { margin-bottom: 16px; font-size: 1rem; color: #f1f5f9; }
  .input-row { display: flex; gap: 12px; }
  .text-input {
    flex: 1; padding: 12px 16px; border-radius: 8px;
    border: 2px solid #334155; background: #0f172a; color: white;
    font-size: 0.95rem; outline: none;
  }
  .text-input:focus { border-color: #3b82f6; }

  .event-list { display: grid; gap: 16px; }
  .event-item {
    background: #1e293b; border-radius: 12px; padding: 20px;
    border: 1px solid #334155;
    display: flex; align-items: flex-start; gap: 20px;
    flex-wrap: wrap;
  }
  .event-info { flex: 1; min-width: 200px; }
  .event-name { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
  .event-url { font-size: 0.78rem; color: #64748b; word-break: break-all; }
  .event-count { font-size: 0.82rem; color: #10b981; margin-top: 4px; }
  .event-status { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-top: 4px; }
  .status-active { background: #064e3b; color: #6ee7b7; }
  .status-archived { background: #44403c; color: #d6d3d1; }

  .qr-wrap { background: white; padding: 10px; border-radius: 8px; }
  .event-actions { display: flex; flex-direction: column; gap: 8px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th {
    background: #1e293b; padding: 12px 14px; text-align: left;
    color: #94a3b8; font-weight: 600; font-size: 0.8rem;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 2px solid #334155;
  }
  td { padding: 12px 14px; border-bottom: 1px solid #1e293b; color: #e2e8f0; }
  tr:hover td { background: #1e293b; }
  tr:nth-child(even) td { background: #0f172a40; }

  .bool-yes { color: #10b981; font-weight: 600; }
  .bool-no { color: #f87171; font-weight: 600; }

  .filter-bar {
    display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
  }
  .filter-bar select, .filter-bar input {
    padding: 10px 14px; border-radius: 8px;
    border: 2px solid #334155; background: #1e293b; color: white;
    font-size: 0.9rem; outline: none;
  }

  /* Modal QR */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #1e293b; border-radius: 16px; padding: 32px;
    text-align: center; max-width: 400px; width: 90%;
  }
  .modal-content h3 { margin-bottom: 20px; font-size: 1.2rem; }
  #modalQR { display: flex; justify-content: center; margin-bottom: 16px; }
  .modal-url { font-size: 0.75rem; color: #64748b; word-break: break-all; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  @media(max-width:600px) {
    .content { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .input-row { flex-direction: column; }
    .event-item { flex-direction: column; }
  }
</style>
</head>
<body>
  <!-- Auth Screen -->
<div id="authScreen">
  <div class="auth-card">
    <h1>🔐 Admin Questionnaire ReSpoP</h1>
    <p>Accès réservé aux administrateurs</p>
    <input type="password" class="auth-input" id="passwordInput" placeholder="Mot de passe">
    <button class="auth-btn" id="authBtn">Accéder</button>

    <div class="auth-error" id="authError">Mot de passe incorrect</div>
  </div>
</div>
<div class="content">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">–</div>
        <div class="stat-label">Réponses totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statToday">–</div>
        <div class="stat-label">Aujourd'hui</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statEvents">–</div>
        <div class="stat-label">Événements actifs</div>
      </div>
    </div>

</body>
