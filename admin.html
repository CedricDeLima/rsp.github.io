<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – ReSpoP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
}

.hidden { display: none !important; }

/* ── LOGIN ── */
#loginScreen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.login-card {
  background: #1e293b;
  border-radius: 16px;
  padding: 40px;
  width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.login-card h2 {
  font-size: 1.4rem;
  margin-bottom: 6px;
  color: #f1f5f9;
}

.login-card p {
  color: #64748b;
  font-size: 0.85rem;
  margin-bottom: 28px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.field label {
  font-size: 0.82rem;
  color: #94a3b8;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.field input {
  padding: 12px 14px;
  border-radius: 8px;
  border: 2px solid #334155;
  background: #0f172a;
  color: white;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}

.field input:focus { border-color: #3b82f6; }

.error-msg {
  color: #f87171;
  font-size: 0.82rem;
  margin-bottom: 12px;
  display: none;
}

/* ── BOUTONS ── */
.btn {
  padding: 11px 18px;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }

.btn-blue  { background: #3b82f6; color: white; }
.btn-green { background: #10b981; color: white; }
.btn-red   { background: #ef4444; color: white; }
.btn-gray  { background: #475569; color: white; }

/* ── TOPBAR ── */
.topbar {
  background: #1e293b;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #334155;
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar h1 {
  font-size: 1.1rem;
  font-weight: 800;
  color: #f1f5f9;
  letter-spacing: -0.02em;
}

.topbar-user {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.82rem;
  color: #64748b;
}

/* ── CONTENU ── */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px;
}

/* ── STATS ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 22px;
  text-align: center;
}

.stat-num {
  font-size: 2.4rem;
  font-weight: 900;
  color: #3b82f6;
  line-height: 1;
}

.stat-label {
  font-size: 0.78rem;
  color: #64748b;
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ── CREATE EVENT ── */
.create-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
}

.create-card h3 {
  font-size: 1rem;
  color: #f1f5f9;
  margin-bottom: 16px;
}

.input-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.text-input {
  flex: 1;
  min-width: 200px;
  padding: 12px 16px;
  border-radius: 8px;
  border: 2px solid #334155;
  background: #0f172a;
  color: white;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}

.text-input:focus { border-color: #3b82f6; }

/* ── EVENTS ── */
.section-title {
  font-size: 0.8rem;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-bottom: 12px;
}

.event-grid { display: grid; gap: 14px; }

.event-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  transition: border-color 0.2s;
}

.event-card:hover { border-color: #475569; }

.event-info { flex: 1; min-width: 180px; }

.event-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: #f1f5f9;
  margin-bottom: 4px;
}

.event-url {
  font-size: 0.75rem;
  color: #475569;
  word-break: break-all;
  margin-bottom: 6px;
}

.event-meta {
  font-size: 0.8rem;
  color: #10b981;
  font-weight: 600;
}

.qr-box {
  background: white;
  padding: 8px;
  border-radius: 8px;
  flex-shrink: 0;
}

.event-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ── LOADING ── */
.loader {
  text-align: center;
  padding: 40px;
  color: #475569;
  font-size: 0.9rem;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #10b981;
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 600;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s;
  z-index: 999;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ── RESPONSIVE ── */
@media(max-width: 600px) {
  .topbar { padding: 12px 16px; }
  .container { padding: 16px; }
  .event-actions { flex-direction: row; }
  .login-card { width: 90%; padding: 24px; }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <h2>🔐 ReSpoP Admin</h2>
    <p>Accès réservé aux administrateurs</p>

    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@exemple.com">
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>

    <div class="error-msg" id="loginError"></div>

    <button class="btn btn-blue" id="loginBtn" style="width: 100%;">Connexion</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">

  <!-- Topbar -->
  <div class="topbar">
    <h1>🗂 ReSpoP · Admin</h1>
    <div class="topbar-user">
      <span id="userEmail">–</span>
      <button class="btn btn-gray" id="logoutBtn" style="padding: 6px 12px; font-size: 0.8rem;">Déconnexion</button>
    </div>
  </div>

  <div class="container">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">–</div>
        <div class="stat-label">Réponses totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statToday">–</div>
        <div class="stat-label">Aujourd'hui</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statEvents">–</div>
        <div class="stat-label">Événements</div>
      </div>
    </div>

    <!-- Create event -->
    <div class="create-card">
      <h3>➕ Créer un événement</h3>
      <div class="input-row">
        <input type="text" class="text-input" id="eventNameInput" placeholder="Nom de l'événement" maxlength="80">
        <button class="btn btn-green" id="createEventBtn">Créer</button>
      </div>
    </div>

    <!-- Events list -->
    <div class="section-title">Événements</div>
    <div id="eventList" class="event-grid">
      <div class="loader">Chargement…</div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- JAVASCRIPT -->
<script>
// ============================================
// SUPABASE CONFIG - EXACT CREDENTIALS FROM INDEX.HTML
// ============================================
const SUPABASE_URL = 'https://xrtmlddmoepmomvtjgok.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhydG1sZGRtb2VwbW9tdnRqZ29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTE2NTEsImV4cCI6MjA5NjMyNzY1MX0.NL1O4kB1GRcEN_Ss4eVRfb3f_j7MbKFiWcScS4FMD5o';

// Initialize Supabase client at TOP LEVEL (not in a function)
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================
// DOM ELEMENTS
// ============================================
const loginScreen = document.getElementById('loginScreen');
const mainApp = document.getElementById('mainApp');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginError = document.getElementById('loginError');
const loginBtn = document.getElementById('loginBtn');
const userEmail = document.getElementById('userEmail');
const logoutBtn = document.getElementById('logoutBtn');
const eventNameInput = document.getElementById('eventNameInput');
const createEventBtn = document.getElementById('createEventBtn');
const eventList = document.getElementById('eventList');
const toast = document.getElementById('toast');

// Stats elements
const statTotal = document.getElementById('statTotal');
const statToday = document.getElementById('statToday');
const statEvents = document.getElementById('statEvents');

// ============================================
// TOAST NOTIFICATIONS
// ============================================
function showToast(msg, color = "#10b981") {
  toast.textContent = msg;
  toast.style.background = color;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============================================
// ESCAPE HTML (XSS PROTECTION)
// ============================================
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ============================================
// UI STATE MANAGEMENT
// ============================================
function showLoginScreen() {
  loginScreen.classList.remove('hidden');
  mainApp.classList.add('hidden');
}

function showMainApp(user) {
  loginScreen.classList.add('hidden');
  mainApp.classList.remove('hidden');
  userEmail.textContent = user.email;
  loadStats();
  loadEvents();
}

// ============================================
// AUTH: Check session on page load
// ============================================
sb.auth.getSession().then(({ data, error }) => {
  if (error) {
    console.error('Session check error:', error);
    return;
  }
  if (data.session) {
    showMainApp(data.session.user);
  }
});

// ============================================
// AUTH: Listen for auth state changes
// ============================================
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    showLoginScreen();
  } else if (event === 'SIGNED_IN' && session) {
    showMainApp(session.user);
  }
});

// ============================================
// LOGIN HANDLER
// ============================================
loginBtn.addEventListener('click', async () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value;

  // Hide previous errors
  loginError.style.display = 'none';

  // Validation
  if (!email || !password) {
    loginError.textContent = 'Remplis tous les champs.';
    loginError.style.display = 'block';
    return;
  }

  // Loading state
  loginBtn.disabled = true;
  loginBtn.textContent = 'Connexion...';

  // Sign in with Supabase Auth
  const { data, error } = await sb.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Connexion';
    loginError.textContent = error.message;
    loginError.style.display = 'block';
    return;
  }

  // Success - will be handled by onAuthStateChange
  loginBtn.textContent = 'Connexion réussie!';
});

 // Enter key triggers login
loginPassword.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});
loginEmail.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});

// ============================================
// LOGOUT HANDLER
// ============================================
logoutBtn.addEventListener('click', async () => {
  await sb.auth.signOut();
  showLoginScreen();
  showToast('Déconnecté', '#475569');
});

// ============================================
// LOAD STATS
// ============================================
async function loadStats() {
  try {
    // Get total responses count
    const { count: totalResponses, error: respError } = await sb
      .from('responses')
      .select('id', { count: 'exact', head: true });

    if (respError) throw respError;

    // Get today's responses
    const today = new Date().toISOString().split('T')[0];
    const { count: todayResponses, error: todayError } = await sb
      .from('responses')
      .select('id', { count: 'exact', head: true })
      .gte('created_at', today + 'T00:00:00');

    if (todayError) throw todayError;

    // Get events count
    const { count: eventsCount, error: eventsError } = await sb
      .from('events')
      .select('id', { count: 'exact', head: true });

    if (eventsError) throw eventsError;

    // Update UI
    statTotal.textContent = totalResponses || 0;
    statToday.textContent = todayResponses || 0;
    statEvents.textContent = eventsCount || 0;
  } catch (err) {
    console.error('loadStats error:', err);
    statTotal.textContent = '–';
    statToday.textContent = '–';
    statEvents.textContent = '–';
  }
}

// ============================================
// LOAD EVENTS
// ============================================
async function loadEvents() {
  try {
    const { data: events, error } = await sb
      .from('events')
      .select('*, responses(count)')
      .order('created_at', { ascending: false });

    if (error) throw error;

    if (!events || events.length === 0) {
      eventList.innerHTML = '<div class="loader">Aucun événement</div>';
      return;
    }

    eventList.innerHTML = '';

    events.forEach(event => {
      c// AVANT
      const url = `${location.origin}/form.html?event=${event.id}`;
//                                                ↑ déjà correct ✅
// Le form.html doit lire ?event= comme UUID

      const responseCount = event.responses?.[0]?.count || 0;
      const createdDate = new Date(event.created_at).toLocaleDateString('fr-FR');

      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <div class="event-info">
          <div class="event-name">${escapeHtml(event.name)}</div>
          <div class="event-url">${escapeHtml(url)}</div>
          <div class="event-meta">${responseCount} réponse${responseCount !== 1 ? 's' : ''} · ${createdDate}</div>
        </div>
        <div class="qr-box" id="qr-${event.id}"></div>
        <div class="event-actions">
          <button class="btn btn-blue copy-btn" data-url="${escapeHtml(url)}">Copier</button>
          <button class="btn btn-red delete-btn" data-id="${event.id}" data-name="${escapeHtml(event.name)}">Supprimer</button>
        </div>
      `;

      eventList.appendChild(card);

      // Generate QR Code
      new QRCode(document.getElementById('qr-' + event.id), {
        text: url,
        width: 90,
        height: 90,
        correctLevel: QRCode.CorrectLevel.H
      });
    });

    // Attach event listeners for buttons
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(btn.dataset.url);
        showToast('Lien copié !');
      });
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const name = btn.dataset.name;
        if (confirm('Supprimer l\'événement "' + name + '" ?')) {
          await deleteEvent(id);
        }
      });
    });

  } catch (err) {
    console.error('loadEvents error:', err);
    eventList.innerHTML = '<div class="loader">Erreur de chargement</div>';
  }
}

// ============================================
// CREATE EVENT
// ============================================
createEventBtn.addEventListener('click', async () => {
  const name = eventNameInput.value.trim();

  if (!name) {
    eventNameInput.focus();
    return;
  }

  createEventBtn.disabled = true;
  createEventBtn.textContent = 'Création...';

  try {
    const { data: { user } } = await sb.auth.getUser();
    
    const { data, error } = await sb
      .from('events')
      .insert({
        name: name,
        user_id: user.id
      })
      .select()
      .single();

    if (error) throw error;

    eventNameInput.value = '';
    showToast('Événement créé ✅');
    loadStats();
    loadEvents();

  } catch (err) {
    console.error('createEvent error:', err);
    showToast('Erreur : ' + err.message, '#ef4444');
  } finally {
    createEventBtn.disabled = false;
    createEventBtn.textContent = 'Créer';
  }
});

// Enter key creates event
eventNameInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') createEventBtn.click();
});

// ============================================
// DELETE EVENT
// ============================================
async function deleteEvent(id) {
  try {
    const { error } = await sb
      .from('events')
      .delete()
      .eq('id', id);

    if (error) throw error;

    showToast('Événement supprimé', '#ef4444');
    loadStats();
    loadEvents();

  } catch (err) {
    console.error('deleteEvent error:', err);
    showToast('Erreur suppression', '#ef4444');
  }
}
</script>

</body>
