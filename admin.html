<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="auth-card">
    <h1>🔐 Admin Questionnaire ReSpoP</h1>
    <p>Accès réservé aux administrateurs</p>
    <input type="password" class="auth-input" id="passwordInput" placeholder="Mot de passe">
    <button class="auth-btn" id="authBtn">Accéder</button>
    <div class="auth-error" id="authError">Mot de passe incorrect</div>
  </div>
</div>

<!-- APP -->
<div id="mainApp" style="display:none;">

  <div class="topbar">
    <h1>Dashboard ReSpoP</h1>
  </div>

  <div class="content">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">–</div>
        <div class="stat-label">Réponses totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statToday">–</div>
        <div class="stat-label">Aujourd'hui</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statEvents">–</div>
        <div class="stat-label">Événements actifs</div>
      </div>
    </div>

  </div>
</div>

<script>
const PASSWORD = "admin123"; // change ça

document.getElementById("authBtn").onclick = () => {
  const input = document.getElementById("passwordInput").value;

  if (input === PASSWORD) {
    document.getElementById("authScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
  } else {
    document.getElementById("authError").style.display = "block";
  }
};
</script>

</body>
